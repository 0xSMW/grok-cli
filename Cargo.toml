[workspace]
members = [
    "crates/grok-client",
    "crates/grok-cli",
    "crates/grok-proxy",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/0xSMW/grok-cli"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
clap = "4"
core-foundation = "0.10"
dirs = "6"
futures-util = "0.3"
percent-encoding = "2"
predicates = "3"
pretty_assertions = "1"
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
tower = "0.5"
tower-http = "0.6"
url = "2"
uuid = "1"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
uninlined_format_args = "deny"
